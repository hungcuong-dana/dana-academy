<script src="oj.js"></script>
<script>
  // build a year-long contribution heatmap (53 weeks x 7 days)
  const grid = document.getElementById('heatGrid');
  const levels = ['var(--hm-0)','var(--hm-1)','var(--hm-2)','var(--hm-3)','var(--hm-4)'];
  const total = 53*7;
  for(let i=0;i<total;i++){
    const cell = document.createElement('div');
    cell.className='heat-cell';
    // activity concentrated in the last ~5 weeks (right side), like the screenshot
    let lvl = 0;
    if(i > total - 35){
      const r = Math.random();
      lvl = r>0.78 ? 4 : r>0.6 ? 3 : r>0.42 ? 2 : r>0.25 ? 1 : 0;
    }
    cell.style.background = levels[lvl];
    grid.appendChild(cell);
  }
</script>
