<div class="c-srch">
  <div class="c-srch-h"><i class="fa fa-search"></i> {{ _('Tìm kiếm') }}</div>
  <form id="filter-form" name="form" action="" method="get">
    {% if current_tab %}
      <input type="hidden" name="tab" value="{{ current_tab }}">
    {% endif %}
    <input id="search" class="c-inp" type="text" name="search" value="{{ search_query or '' }}"
           placeholder="{{ _('Tìm khoá học…') }}">
    {% if current_tab == 'my' and request.user.is_authenticated %}
      <label class="c-srch-lbl" for="role_filter">{{ _('Lọc theo vai trò') }}</label>
      <select id="role_filter" class="c-inp" name="role_filter">
        <option value="">{{ _('Tất cả vai trò') }}</option>
        <option value="teaching" {% if role_filter=='teaching' %}selected{% endif %}>{{ _('Giảng dạy + Trợ giảng') }}</option>
        <option value="student" {% if role_filter=='student' %}selected{% endif %}>{{ _('Học viên') }}</option>
      </select>
    {% endif %}
    <button id="go" type="submit" class="c-btn primary block">{{ _('Tìm kiếm') }}</button>
  </form>
</div>
