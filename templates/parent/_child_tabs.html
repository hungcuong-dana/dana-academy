{# Reusable header + tab strip for child detail pages. Active tab via {{ active }} #}
<div style="margin-bottom:1.25rem;">
  <a href="{{ url('parent_home') }}"
     style="font-size:0.9rem; text-decoration:none; color:#1958c1;
            display:inline-flex; align-items:center; gap:0.3rem;
            margin-bottom:0.6rem;">
    ← Quay lại danh sách học sinh
  </a>
  <div style="display:flex; align-items:center; gap:0.85rem; margin-bottom:0.85rem;">
    {% if child.get_profile_image_url() %}
      <img src="{{ child.get_profile_image_url() }}" alt=""
           style="width:48px; height:48px; border-radius:50%; object-fit:cover;">
    {% endif %}
    <div>
      <div style="font-size:1.25rem; font-weight:700;">{{ child_display_name }}</div>
      <div style="font-size:0.85rem; color:#888;">Tài khoản: {{ child.user.username }}</div>
    </div>
  </div>
  <div class="parent-tabs">
    <a href="{{ url('parent_child_overview', child.id) }}"
       class="{% if active == 'overview' %}active{% endif %}">📊 Tổng quan</a>
    <a href="{{ url('parent_child_submissions', child.id) }}"
       class="{% if active == 'submissions' %}active{% endif %}">📝 Bài làm</a>
    <a href="{{ url('parent_child_contests', child.id) }}"
       class="{% if active == 'contests' %}active{% endif %}">🏆 Kì thi</a>
    <a href="{{ url('parent_child_ai', child.id) }}"
       class="{% if active == 'ai' %}active{% endif %}">💬 Đánh giá từ giáo viên</a>
  </div>
</div>
